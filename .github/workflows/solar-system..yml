name: Solar system workflow

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feature/*'

jobs:
    unit-testing:
        name: Unit testing
        runs-on: ubuntu-latest
        steps:
        - name: Checkout repos
          uses: actions/checkout@v4
        
        - name: setup nodeJs version 18
          uses: actions/setup-node@v3
          with:
            node-version: 18
        
        - name: install dependencies
          run: npm install

        - name: Unit Testing
          run: npm test
  